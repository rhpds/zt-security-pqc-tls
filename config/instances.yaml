---
virtualmachines:
  - name: "rhel"
    image: "rhel-10-1-04-15-26"
    bootloader: efi
    memory: "4G"
    cores: 1
    image_size: "40G"
    tags:
      - key: "AnsibleGroup"
        value: "bastions"
    networks:
      - default
    # Expose the web app for the "Web App" browser tab via an EDGE route.
    # This platform's route role injects custom headers, which OpenShift allows
    # only on edge/re-encrypt routes (NOT passthrough). An edge route terminates
    # TLS at the OpenShift router (trusted cert, no browser warning) and forwards
    # plain HTTP to the VM. So nginx serves a side HTTP port (8080) just for the
    # tab; the HTTPS/443 server stays dedicated to the PQC terminal exercises.
    services:
      - name: webapp
        ports:
          - port: 8080
            protocol: TCP
            targetPort: 8080
            name: webapp
    routes:
      - name: webapp
        host: webapp
        service: webapp
        targetPort: 8080
        tls: true
        tls_termination: Edge
