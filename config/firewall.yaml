---
# By default egress traffic is not allowed, define below the ports allowed.
egress:
  - ports:
      - protocol: TCP
        port: 443
# Allow inbound HTTP on 8080 so the "Web App" tab (OpenShift edge route -> VM
# nginx HTTP on 8080) can reach the web server. The HTTPS/443 server used by the
# PQC terminal exercises is reached over loopback and needs no ingress rule.
ingress:
  - ports:
      - protocol: TCP
        port: 8080
