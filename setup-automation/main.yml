---
- name: Register the TLS learner VM for setup
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    setup_bastion_host: "{{ lookup('ansible.builtin.env', 'BASTION_HOST') }}"
    setup_bastion_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') | default('22', true) }}"
    setup_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
    setup_password: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
  tasks:
    - name: Require the provisioned SSH connection settings
      ansible.builtin.assert:
        that:
          - setup_bastion_host | length > 0
          - setup_bastion_port | int > 0
          - setup_user | length > 0
          - setup_password | length > 0
      no_log: true

    - name: Add the learner bastion
      ansible.builtin.add_host:
        name: "{{ item.vm }}"
        groups: tls_lab_setup
        ansible_host: "{{ item.endpoint }}"
        ansible_port: "{{ item.port | int }}"
        ansible_user: "{{ setup_user }}"
        ansible_password: "{{ setup_password }}"
        ansible_become_password: "{{ setup_password }}"
        ansible_ssh_args: '-o ControlMaster=no -o ControlPath=none -o ControlPersist=no'
        ansible_pipelining: true
      loop:
        - {vm: rhel, endpoint: "{{ setup_bastion_host }}", port: "{{ setup_bastion_port }}"}
      no_log: true

- name: Provision the TLS learner VM
  hosts: tls_lab_setup
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Wait for the bastion to accept SSH
      ansible.builtin.wait_for_connection:
        timeout: 120

    - name: Identify the connected VM before making changes
      ansible.builtin.command: hostname -s
      register: setup_hostname
      changed_when: false

    - name: Require each endpoint to reach the intended VM
      ansible.builtin.assert:
        that: setup_hostname.stdout | trim == inventory_hostname
        fail_msg: "Setup endpoint for {{ inventory_hostname }} reached {{ setup_hostname.stdout | trim }} instead."

    - name: Install the TLS lab prerequisites and nginx configuration
      ansible.builtin.command:
        argv: [timeout, '300', /bin/bash, -s]
        stdin: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/setup-' ~ inventory_hostname ~ '.sh') }}"
        expand_argument_vars: false
      become: true
      no_log: true
      environment:
        GUID: "{{ lookup('ansible.builtin.env', 'GUID') }}"
        DOMAIN: "{{ lookup('ansible.builtin.env', 'DOMAIN') }}"
