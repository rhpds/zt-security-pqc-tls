---
- ansible.builtin.import_playbook: inventory.yml

- name: "TLS readiness before the learner starts nginx"
  hosts: qa_bastions
  gather_facts: false
  any_errors_fatal: true
  become: true
  tasks:
    - name: Read the RHEL release
      ansible.builtin.command: cat /etc/redhat-release
      register: rhel_release
      changed_when: false
    - name: Read the OpenSSL version
      ansible.builtin.command: openssl version
      register: openssl_release
      changed_when: false
    - name: "Inspect the system-wide crypto policy"
      ansible.builtin.command:
        argv: ["update-crypto-policies", "--show"]
      register: policy
      changed_when: false
    - name: "Inspect OpenSSL TLS groups"
      ansible.builtin.command:
        argv: ["openssl", "list", "-tls-groups"]
      register: openssl_tls_groups
      changed_when: false
    - name: "Validate the provisioned nginx configuration"
      ansible.builtin.command:
        argv: ["nginx", "-t"]
      changed_when: false
    - name: "Inspect the provisioned server configuration"
      ansible.builtin.command:
        argv: ["grep", "-E", "^[[:space:]]*ssl_ecdh_curve[[:space:]]+", "/etc/nginx/conf.d/pqc-web.conf"]
      register: curve
      changed_when: false
    - name: "Check that nginx has not been started"
      ansible.builtin.command:
        argv: ["systemctl", "is-active", "nginx"]
      register: nginx_state
      changed_when: false
      failed_when: false
    - name: "Verify the learner's web page is provisioned"
      ansible.builtin.command:
        argv: ["grep", "-F", "Super-Business Secure Portal", "/usr/share/nginx/html/index.html"]
      changed_when: false
    - name: "Assert the clean classical-only server baseline"
      ansible.builtin.assert:
        that:
          - rhel_release.stdout is search('^Red Hat Enterprise Linux.* release 10[.][1-9][0-9]*(?:[. ]|$)')
          - openssl_release.stdout.split() | length >= 2
          - openssl_release.stdout.split()[0] == 'OpenSSL'
          - openssl_release.stdout.split()[1] is version('3.5.0', '>=')
          - "policy.stdout | trim == 'DEFAULT'"
          - "'X25519MLKEM768' in openssl_tls_groups.stdout"
          - "curve.stdout.split() == ['ssl_ecdh_curve', 'X25519;']"
          - "nginx_state.stdout | trim == 'inactive'"
